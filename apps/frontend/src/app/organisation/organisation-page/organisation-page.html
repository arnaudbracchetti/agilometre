<div class="organisation">
  <section class="organisation__liste">
    <h2 class="organisation__titre">Entités</h2>

    <form class="organisation__creation" (ngSubmit)="creer()">
      <input
        nz-input
        name="nouveauNom"
        placeholder="Nom de la nouvelle Entité"
        [ngModel]="nouveauNom()"
        (ngModelChange)="nouveauNom.set($event)"
      />
      <button nz-button nzType="primary" type="submit" [nzLoading]="creationEnCours()">
        Créer
      </button>
    </form>

    <nz-list [nzDataSource]="entites()" nzBordered>
      @for (entite of entites(); track entite.id) {
        <li
          nz-list-item
          class="organisation__item"
          [class.organisation__item--selectionne]="entite.id === selectionId()"
          role="button"
          tabindex="0"
          (click)="selectionner(entite)"
          (keydown.enter)="selectionner(entite)"
          (keydown.space)="selectionner(entite)"
        >
          {{ entite.nom }}
        </li>
      } @empty {
        <li nz-list-item class="organisation__item-vide">Aucune Entité pour le moment.</li>
      }
    </nz-list>
  </section>

  <section class="organisation__detail">
    @if (entiteSelectionnee(); as entite) {
      <h2 class="organisation__titre">{{ entite.nom }}</h2>

      <form class="organisation__renommage" (ngSubmit)="renommer()">
        <label for="nomRenomme">Nom</label>
        <input
          nz-input
          id="nomRenomme"
          name="nomRenomme"
          [ngModel]="nomRenomme()"
          (ngModelChange)="nomRenomme.set($event)"
        />
        <button
          nz-button
          nzType="primary"
          type="submit"
          [disabled]="!renommagePossible()"
          [nzLoading]="renommageEnCours()"
        >
          Renommer
        </button>
      </form>
    } @else {
      <p class="organisation__etat-vide">Sélectionnez une Entité dans la liste.</p>
    }
  </section>
</div>
