<div class="app-header">
  <div class="app-header__topbar">Agilomètre — diagnostic de maturité agile</div>

  <header class="app-header__row">
    <a routerLink="/" class="app-header__brand">Agilomètre</a>
    <nav class="app-header__nav">
      @for (lien of liens(); track lien.label) {
        @if (lien.routerLink) {
          <a [routerLink]="lien.routerLink" routerLinkActive="app-header__link--active">{{ lien.label }}</a>
        } @else {
          <a [href]="lien.href ?? 'javascript:void(0)'">{{ lien.label }}</a>
        }
      }
      <ng-content></ng-content>
    </nav>
  </header>
</div>
