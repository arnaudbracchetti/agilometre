  <div class="ajustement">
    <header class="ajustement__entete">
      <div class="ajustement__infos">
        <h2 class="ajustement__titre">{{ equipeNom() }}</h2>
        <span class="ajustement__date">{{ date() | date: 'dd/MM/yyyy' }}</span>
        <nz-tag [nzColor]="statut() === 'OUVERTE' ? 'blue' : 'default'">
          {{ statut() === 'OUVERTE' ? 'Ouverte' : 'Clôturée' }}
        </nz-tag>
      </div>
      <a nz-button nzType="default" routerLink="/sessions">Retour à la liste</a>
    </header>

    @if (verrouillee()) {
      <div class="ajustement__bandeau-verrou">
        Cette Session est verrouillée : seul le retrait de Question reste possible.
      </div>
    }

    <app-selection-editor
      [themes]="themes()"
      [selection]="selection()"
      [verrouillee]="verrouillee()"
      (ajouterQuestion)="onAjouterQuestion($event)"
      (ajouterTheme)="onAjouterTheme($event)"
      (retirerQuestion)="onRetirerQuestion($event)"
      (reordonnerQuestion)="onReordonnerQuestion($event)"
    />
  </div>
