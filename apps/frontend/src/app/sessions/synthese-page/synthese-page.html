<div class="synthese">
  @if (chargementEnCours()) {
    <app-chargement />
  } @else if (inaccessible()) {
    <app-error-message
      message="Cet écran de synthèse n’est plus accessible."
      taille="page"
      class="synthese__erreur"
    />
  } @else {
    <header class="synthese__entete">
      <div class="synthese__contexte">
        <h1 class="synthese__titre">Synthèse de la séance du {{ date() | date: 'dd/MM/yyyy' }}</h1>
        <span class="synthese__sous-titre">{{ equipeNom() }}</span>
      </div>
      <div class="synthese__actions" *aDroit="'gererSessions'">
        <a nz-button nzType="default" [routerLink]="['/sessions', sessionId(), 'pilotage']">
          Retour au pilotage
        </a>
        @if (statut() === 'OUVERTE') {
          <button
            class="synthese__bouton-terminer"
            nz-button
            nzType="primary"
            nzDanger
            nz-popconfirm
            nzPopconfirmTitle="Terminer la séance ? Cette action est définitive : le Code, les accès participants et l'écran de projection deviendront inopérants."
            (nzOnConfirm)="terminerSeance()"
            [disabled]="terminerEnCours()"
          >
            Terminer la séance
          </button>
        }
      </div>
    </header>

    <button
      class="synthese__aide"
      nz-button
      nzType="text"
      (click)="ouvrirGlossaire()"
    >
      <span nz-icon nzType="question-circle" nzTheme="outline" aria-hidden="true"></span>
      Comprendre les résultats
    </button>

    <app-synthese-themes
      [themes]="themes()"
      [palierGlobal]="palierGlobal()"
      [tauxApprocheGlobal]="tauxApprocheGlobal()"
      [margeAvantDescenteGlobal]="margeAvantDescenteGlobal()"
      messageVide="Aucune réponse enregistrée sur cette séance."
    />
  }
</div>
