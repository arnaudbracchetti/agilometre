<div class="oubli">
  <div class="oubli__card">
    @if (envoye()) {
      <h1 class="oubli__titre">Email envoyé</h1>
      <p>
        Si un compte existe avec cette adresse, un email vient de lui être envoyé pour définir un
        mot de passe.
      </p>
      <a routerLink="/connexion">Retour à la connexion</a>
    } @else {
      <form (ngSubmit)="demander()">
        <h1 class="oubli__titre">Mot de passe oublié</h1>
        <p>Saisissez votre email : un lien pour définir un nouveau mot de passe vous sera envoyé.</p>

        <label class="oubli__champ">
          <span>Email</span>
          <input
            nz-input
            type="email"
            name="email"
            autocomplete="username"
            required
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
          />
        </label>

        <button nz-button nzType="primary" nzBlock [nzLoading]="enCours()" type="submit">
          Envoyer
        </button>
      </form>
    }
  </div>
</div>
