services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agilometre}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agilometre}
      POSTGRES_DB: ${POSTGRES_DB:-agilometre}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agilometre}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles: ["test"]
    environment:
      POSTGRES_USER: ${POSTGRES_TEST_USER:-agilometre}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-agilometre}
      POSTGRES_DB: ${POSTGRES_TEST_DB:-agilometre_test}
    ports:
      - "${POSTGRES_TEST_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_TEST_USER:-agilometre}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Relais SMTP local (dev + e2e) : capture tout, ne laisse rien sortir — indispensable pour tester
  # des invitations/réinitialisations de mot de passe sans arroser de vraies adresses (issue #60,
  # doc/spec/annexes/gestion-des-droits.md). Pas de `profiles` : utilisé en dev *et* en test, comme
  # `postgres`.
  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    # Sans ce flag, Mailpit fait une résolution DNS inverse de l'IP connectante à chaque email —
    # observé à ~8s par envoi sous WSL2 (résolveur DNS local lent), retardant d'autant chaque
    # création de compte / demande de réinitialisation.
    command: --smtp-disable-rdns
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Webmail / API REST

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-agilometre}:${POSTGRES_PASSWORD:-agilometre}@postgres:5432/${POSTGRES_DB:-agilometre}?schema=public
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET est requis}
      APP_URL: ${APP_URL:?APP_URL est requis}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST est requis}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Agilomètre <no-reply@agilometre.local>}
    ports:
      - "8080:3000"

volumes:
  postgres-data:
